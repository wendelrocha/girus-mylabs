apiVersion: v1
kind: ConfigMap
metadata:
  name: linux-fundamentos-devops-parte-1
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: linux-fundamentos-devops-parte-1
    title: "Fundamentos Linux para DevOps Parte 1 - Exclusivo"
    description: "Aprenda os comandos e conceitos essenciais do Linux para profissionais DevOps, SRE e administradores de sistemas"
    duration: 60m
    image: "linuxtips/girus-devops:0.1"
    tasks:
      - name: "Navegação e Manipulação de Arquivos"
        description: "Aprenda a navegar pelo sistema de arquivos Linux e manipular arquivos e diretórios"
        steps:
          - "Vamos começar explorando o sistema de arquivos Linux. Execute o comando abaixo para ver em qual diretório você está:"
          - "`pwd`"
          - "Agora vamos listar os arquivos e diretórios nesta localização:"
          - "`ls -la`"
          - "Crie uma estrutura de diretórios para um projeto fictício:"
          - "`mkdir -p projeto/{src,docs,config}`"
          - "Verifique se a estrutura foi criada corretamente:"
          - "`ls -la projeto/`"
          - "Agora, vamos criar alguns arquivos dentro desses diretórios:"
          - "`touch projeto/src/app.py`"
          - "`touch projeto/docs/README.md`"
          - "`echo 'Projeto de demonstração para DevOps' > projeto/README.md`"
          - "Vamos visualizar o conteúdo do arquivo README.md:"
          - "`cat projeto/README.md`"
          - "Vamos copiar o README.md para o diretório docs:"
          - "`cp projeto/README.md projeto/docs/`"
          - "Vamos mover o app.py para um novo nome:"
          - "`mv projeto/src/app.py projeto/src/main.py`"
          - "Verifique se todas as mudanças foram aplicadas:"
          - "`find projeto -type f | sort`"
        tips:
          - type: "info"
            title: "Estrutura de Diretórios Linux"
            content: "No Linux, tudo começa a partir do diretório raiz (/). O diretório /home contém as pastas dos usuários, /etc contém arquivos de configuração, e /var armazena dados variáveis como logs."
          - type: "tip"
            title: "Autocomplete com TAB"
            content: "Use a tecla TAB para autocompletar nomes de arquivos e diretórios. Pressione duas vezes para ver todas as possibilidades."
          - type: "warning"
            title: "Cuidado com rm"
            content: "O comando rm remove arquivos permanentemente, sem enviar para uma 'lixeira'. Especialmente cuidado com rm -rf que remove diretórios recursivamente sem confirmação."
        validation:
          - command: "find projeto -type f | wc -l"
            expectedOutput: "3"
            errorMessage: "Você não criou 3 arquivos na estrutura de diretórios"
          - command: "test -f projeto/src/main.py && echo 'true' || echo 'false'"
            expectedOutput: "true"
            errorMessage: "O arquivo main.py não existe no diretório src"
      
      - name: "Gerenciamento de Usuários e Grupos"
        description: "Aprenda a criar e gerenciar usuários e grupos no Linux"
        steps:
          - "Vamos começar verificando as informações do seu usuário atual:"
          - "`id`"
          - "Veja os usuários cadastrados no sistema:"
          - "`cat /etc/passwd | grep -v nologin | grep -v false`"
          - "Agora, vamos criar um novo usuário para nossa equipe de DevOps:"
          - "`sudo useradd -m -s /bin/bash devops`"
          - "Defina uma senha para este usuário:"
          - "`sudo passwd devops`"
          - "Agora, vamos criar um grupo para desenvolvedores:"
          - "`sudo groupadd developers`"
          - "Vamos adicionar nosso usuário devops ao grupo developers:"
          - "`sudo usermod -aG developers devops`"
          - "Vamos verificar se o usuário foi adicionado ao grupo corretamente:"
          - "`groups devops`"
          - "Crie um diretório para projetos da equipe de desenvolvimento:"
          - "`sudo mkdir -p /opt/projects`"
          - "Mude o proprietário e grupo do diretório:"
          - "`sudo chown root:developers /opt/projects`"
          - "Configure as permissões para que os desenvolvedores possam escrever no diretório:"
          - "`sudo chmod 775 /opt/projects`"
          - "Verifique as permissões:"
          - "`ls -ld /opt/projects`"
        tips:
          - type: "info"
            title: "Usuários no Linux"
            content: "Cada usuário possui um UID (User ID) único. O usuário root possui UID 0 e tem controle total sobre o sistema."
          - type: "tip"
            title: "Usando sudo"
            content: "O comando sudo permite executar comandos como superusuário temporariamente, sem precisar fazer login como root."
          - type: "warning"
            title: "Segurança"
            content: "Sempre siga o princípio do menor privilégio. Conceda apenas as permissões necessárias para os usuários realizarem suas tarefas."
        validation:
          - command: "getent group developers | grep -q devops && echo 'true' || echo 'false'"
            expectedOutput: "true"
            errorMessage: "O usuário devops não foi adicionado ao grupo developers"
          - command: "stat -c '%a' /opt/projects"
            expectedOutput: "775"
            errorMessage: "As permissões do diretório /opt/projects não estão configuradas corretamente"
      
      - name: "Sistema de Permissões"
        description: "Trabalhe com o sistema de permissões do Linux para controlar o acesso a arquivos e diretórios"
        steps:
          - "Vamos criar um diretório para praticar permissões:"
          - "`mkdir -p /tmp/permissoes-demo`"
          - "Crie alguns arquivos para experimentos:"
          - "`touch /tmp/permissoes-demo/{arquivo1.txt,arquivo2.txt,script.sh}`"
          - "Vamos tornar o script.sh executável:"
          - "`chmod +x /tmp/permissoes-demo/script.sh`"
          - "Verifique as permissões atuais:"
          - "`ls -l /tmp/permissoes-demo/`"
          - "Vamos adicionar um conteúdo simples ao script:"
          - "`echo '#!/bin/bash' > /tmp/permissoes-demo/script.sh`"
          - "`echo 'echo \"Script executado com sucesso!\"' >> /tmp/permissoes-demo/script.sh`"
          - "Execute o script para testar:"
          - "`/tmp/permissoes-demo/script.sh`"
          - "Agora vamos remover a permissão de execução:"
          - "`chmod -x /tmp/permissoes-demo/script.sh`"
          - "Tente executar novamente e observe o erro:"
          - "`/tmp/permissoes-demo/script.sh`"
          - "Vamos usar o modo numérico para configurar permissões:"
          - "`chmod 644 /tmp/permissoes-demo/arquivo1.txt`"
          - "`chmod 600 /tmp/permissoes-demo/arquivo2.txt`"
          - "`chmod 755 /tmp/permissoes-demo/script.sh`"
          - "Verifique as diferentes permissões:"
          - "`ls -l /tmp/permissoes-demo/`"
          - "Crie um arquivo somente para leitura:"
          - "`touch /tmp/permissoes-demo/readonly.txt`"
          - "`chmod 444 /tmp/permissoes-demo/readonly.txt`"
          - "Tente escrever no arquivo somente leitura e veja o erro:"
          - "`echo 'teste' > /tmp/permissoes-demo/readonly.txt`"
        tips:
          - type: "info"
            title: "Permissões Numéricas"
            content: "No formato octal: 4 = read, 2 = write, 1 = execute. Somando esses valores, temos: 7 = rwx, 6 = rw-, 5 = r-x, 4 = r--"
          - type: "tip"
            title: "Permissões para Scripts"
            content: "Scripts shell precisam da permissão de execução (x) para serem executados diretamente. Sem essa permissão, você precisaria usar 'bash script.sh'"
          - type: "warning"
            title: "Permissões para Diretórios"
            content: "Para diretórios, a permissão 'x' significa acesso (cd), 'r' permite listar conteúdo, e 'w' permite criar/deletar arquivos."
        validation:
          - command: "ls -l /tmp/permissoes-demo/script.sh | awk '{print $1}' | grep -q '^-rwxr-xr-x' && echo 'true' || echo 'false'"
            expectedOutput: "true"
            errorMessage: "O arquivo script.sh não tem as permissões 755 configuradas corretamente"
          - command: "ls -l /tmp/permissoes-demo/readonly.txt | awk '{print $1}' | grep -q '^-r--r--r--' && echo 'true' || echo 'false'"
            expectedOutput: "true"
            errorMessage: "O arquivo readonly.txt não tem as permissões 444 configuradas corretamente"
      
      - name: "Gerenciamento de Pacotes e Processos"
        description: "Aprenda a instalar software e gerenciar processos no Linux em ambiente containerizado"
        steps:
          - "Vamos começar atualizando a lista de pacotes disponíveis:"
          - "`apt update`"
          - "Vamos instalar algumas ferramentas úteis para administração:"
          - "`apt install -y procps net-tools htop curl wget`"
          - "Verifique se as ferramentas foram instaladas corretamente:"
          - "`which htop curl wget`"
          - "Vamos criar um processo simples em segundo plano:"
          - "`sleep 300 &`"
          - "Veja os processos em execução:"
          - "`ps aux | grep sleep`"
          - "Note o PID (Process ID) do processo 'sleep' para uso futuro:"
          - "`pgrep sleep`"
          - "Vamos ver informações de uso de CPU e memória:"
          - "`top -b -n 1 | head -15`"
          - "Uma alternativa mais amigável é o htop (pressione q para sair):"
          - "`htop`"
          - "Vamos verificar o uso de memória no sistema:"
          - "`free -h`"
          - "Vamos verificar o espaço em disco:"
          - "`df -h`"
          - "Vamos verificar as interfaces de rede e endereços IP:"
          - "`ip addr`"
          - "Ou usando o comando mais antigo:"
          - "`ifconfig`"
          - "Vamos verificar as conexões de rede abertas:"
          - "`netstat -tulpn`"
          - "Para encerrar nosso processo sleep, usamos kill com o PID obtido anteriormente:"
          - "`pkill sleep`"
          - "Confirme que o processo foi encerrado:"
          - "`ps aux | grep sleep`"
          - "Para buscar pacotes disponíveis, use o comando apt search:"
          - "`apt search editor | head -5`"
          - "Para remover um pacote (não execute agora):"
          - "`# apt remove pacote_exemplo`"
        tips:
          - type: "info"
            title: "Gerenciadores de Pacotes"
            content: "Distribuições baseadas em Debian (Ubuntu, Linux Mint) usam apt. Distribuições baseadas em Red Hat (RHEL, CentOS, Fedora) usam dnf/yum. Alpine Linux usa apk."
          - type: "tip"
            title: "Monitoramento de Processos"
            content: "Em ambientes containerizados, frequentemente usamos ferramentas como ps, top, htop para monitorar processos ao invés de gerenciadores de serviços como systemd."
          - type: "warning"
            title: "Containers vs VMs"
            content: "Containers compartilham o kernel do host e são mais leves que VMs. Por isso, normalmente não contêm init systems completos como systemd, e processos são gerenciados diretamente."
        validation:
          - command: "command -v htop >/dev/null 2>&1 && echo 'true' || echo 'false'"
            expectedOutput: "true"
            errorMessage: "O htop não foi instalado corretamente"
          - command: "command -v curl >/dev/null 2>&1 && echo 'true' || echo 'false'"
            expectedOutput: "true"
            errorMessage: "O curl não foi instalado corretamente"
