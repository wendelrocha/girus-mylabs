apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-troubleshooting-crashloop-desafio-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: kubernetes-troubleshooting-crashloop-desafio
    title: "Desafio: O Mistério do Pod em CrashLoopBackOff"
    description: "Você é o detetive! Use suas habilidades de troubleshooting em Kubernetes para investigar um Pod em CrashLoopBackOff, descobrir a causa raiz e aplicar a correção por conta própria."
    duration: 15m
    image: "linuxtips/girus-kind-single-node:0.1"
    privileged: true
    timerEnabled: true
    maxDuration: 15m
    tasks:
      - name: "Cena do Crime: Criando o Pod com Falha"
        description: "Nesta primeira etapa, vamos reproduzir o cenário de um Pod que entra em CrashLoopBackOff. Criaremos um Deployment com uma falha intencional para simular um problema real."
        steps:
          - "Bem-vindo, detetive! Sua missão é resolver o mistério do Pod que não quer viver. Primeiro, vamos preparar a cena do crime."
          - "Vamos criar um namespace isolado para nossa investigação:"
          - "`kubectl create namespace misterio-crashloop`"
          - "Agora, crie um arquivo chamado deployment-falho.yaml. Este manifesto descreve uma aplicação que precisa de uma senha de banco de dados, mas nós 'esqueceremos' de fornecê-la."
          - |
            ```
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app-misteriosa
              namespace: misterio-crashloop
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: misteriosa
              template:
                metadata:
                  labels:
                    app: misteriosa
                spec:
                  containers:
                  - name: app
                    image: linuxtips/crash-app:0.1
                    env:
                    - name: PORT
                      value: "8080"
            ```
          - "Com o manifesto criado, vamos aplicar a configuração no cluster:"
          - "`kubectl apply -f deployment-falho.yaml`"
          - "Agora, vamos observar o status do nosso Pod. Aguarde alguns instantes e execute o comando abaixo para acompanhar as mudanças em tempo real."
          - "`kubectl get pods -n misterio-crashloop -w`"
          - "Observe a saída. Você verá o temido status CrashLoopBackOff e o número de reinicializações (RESTARTS) aumentando. O Kubernetes está tentando iniciar o container, mas ele falha repetidamente. Pressione Ctrl+C para sair do modo de observação."
        tips:
          - type: "info"
            title: "O que é CrashLoopBackOff?"
            content: "Este não é um erro, mas um status. O Kubernetes está informando que a aplicação dentro do seu container está falhando ao iniciar ou travando. O trabalho dele é tentar de novo, criando um loop."
          - type: "warning"
            title: "Paciência, Detetive"
            content: "Pode levar de 30 segundos a um minuto para o status mudar de ContainerCreating ou Error para CrashLoopBackOff. Isso ocorre porque o Kubernetes espera um tempo (back-off) antes de tentar reiniciar o Pod."
        validation:
          - command: "kubectl get pods -n misterio-crashloop -l app=misteriosa | grep -q 'CrashLoopBackOff' && echo 'CrashLoopBackOff' || echo 'Not Found'"
            expectedOutput: "CrashLoopBackOff"
            errorMessage: "O Pod não entrou em CrashLoopBackOff como esperado. Verifique se o deployment foi criado corretamente no namespace 'misterio-crashloop'."

      - name: "Pista 1: A Autópsia do Pod com describe"
        description: "Use a ferramenta kubectl describe para coletar as primeiras pistas vitais sobre o motivo da falha, como o código de saída e os eventos do ciclo de vida do Pod."
        steps:
          - "Nossa primeira ferramenta de investigação é o kubectl describe. Ele nos dá um dossiê completo do Pod, quase uma 'autópsia' do que aconteceu."
          - "Primeiro, vamos pegar o nome exato do nosso Pod problemático e armazená-lo em uma variável para facilitar:"
          - "`POD_NAME=$(kubectl get pods -n misterio-crashloop -l app=misteriosa -o jsonpath='{.items[0].metadata.name}')`"
          - "Agora, vamos usar o describe para investigar:"
          - "`kubectl describe pod $POD_NAME -n misterio-crashloop`"
          - "Analise a saída com atenção. Duas seções são cruciais:"
          - "1. State / Last State: Perto do topo, dentro da descrição do container, você verá o estado atual (State: Waiting) e o estado anterior (Last State: Terminated). Observe o Exit Code. Um código diferente de 0 indica uma falha. No nosso caso, deve ser Exit Code: 1."
          - "2. Events: No final da saída, a seção de eventos é a linha do tempo do crime. Você verá eventos como Pulling, Pulled, Created, Started e, o mais importante, Back-off restarting failed container. Isso confirma o loop de reinicialização."
          - "A pista do Exit Code: 1 nos diz que a aplicação terminou com um erro genérico. Agora precisamos descobrir que erro foi esse."
        tips:
          - type: "info"
            title: "Exit Codes Comuns"
            content: "Exit Code 1 geralmente significa um erro não tratado na aplicação. Exit Code 137 indica que o processo foi terminado por um sinal externo, frequentemente por exceder o limite de memória (OOMKilled). Exit Code 139 indica uma falha de segmentação."
          - type: "tip"
            title: "Filtrando a Saída"
            content: "Para encontrar rapidamente a seção de eventos, você pode usar kubectl describe pod $POD_NAME -n misterio-crashloop | grep -A 10 Events."
        validation:
          - command: "POD_NAME=$(kubectl get pods -n misterio-crashloop -l app=misteriosa -o jsonpath='{.items.metadata.name}'); kubectl describe pod $POD_NAME -n misterio-crashloop | grep 'Exit Code:' | awk '{print $3}' | tail -n 1"
            expectedOutput: "1"
            errorMessage: "O Exit Code do container não é 1. Verifique a saída do comando describe."

      - name: "Pista 2: As Últimas Palavras com logs --previous"
        description: "Investigue os logs do container para encontrar a mensagem de erro exata que está causando a falha, usando a flag --previous para acessar os logs da última tentativa."
        steps:
          - "Sabemos que a aplicação falhou. Agora, precisamos ouvir suas 'últimas palavras': os logs."
          - "Se tentarmos obter os logs do container atual, podemos não ver nada, pois ele pode ter falhado antes de gerar qualquer saída:"
          - "`kubectl logs $POD_NAME -n misterio-crashloop`"
          - "A mágica do detetive de Kubernetes é usar a flag --previous. Ela nos mostra os logs da última vez que o container tentou executar, antes de falhar."
          - "`kubectl logs $POD_NAME -n misterio-crashloop --previous`"
        tips:
          - type: "warning"
            title: "Por que --previous?"
            content: "Quando um container está em CrashLoopBackOff, o container atual está em um estado de espera. Os logs que importam são os da execução anterior que falhou. A flag '--previous' é essencial para depurar esses cenários."
          - type: "tip"
            title: "E se não houver logs?"
            content: "Se mesmo com --previous os logs estiverem vazios, o problema pode ser na inicialização do container (ex: erro no entrypoint do Dockerfile) ou uma falha de Liveness Probe mal configurada, que mata o container antes que ele possa logar algo."
        validation:
          - command: "POD_NAME=$(kubectl get pods -n misterio-crashloop -l app=misteriosa -o jsonpath='{.items.metadata.name}'); kubectl describe pod $POD_NAME -n misterio-crashloop | grep 'Exit Code:' | awk '{print $3}' | tail -n 1"
            expectedOutput: "1"
            errorMessage: "O Exit Code do container não é 1. Verifique a saída do comando describe."

      - name: "O Desafio: Resolva o Mistério"
        description: "Com todas as pistas em mãos, agora é sua vez de aplicar a solução. Corrija o problema para que o Pod inicie com sucesso."
        steps:
          - "Detetive, você concluiu a investigação e descobriu a causa raiz: a aplicação está falhando porque a variável de ambiente DB_PASSWORD não foi definida."
          - "**Seu desafio é:** Corrigir o ambiente para que o Deployment app-misteriosa consiga fornecer essa variável de ambiente para a aplicação."
          - "Você precisará modificar a configuração do Kubernetes para que o Pod suba com sucesso e permaneça no estado Running."
          - "Quando o Deployment tiver 1 réplica pronta (READY 1/1), a validação será bem-sucedida."
        tips:
          - type: "info"
            title: "Como fornecer variáveis?"
            content: "Lembre-se das formas de injetar dados em Pods no Kubernetes. Para dados de configuração simples, usa-se `ConfigMap`. Para dados sensíveis como senhas, a prática recomendada é usar `Secret`."
          - type: "tip"
            title: "Atualizando um Deployment"
            content: "Para aplicar sua correção, você pode usar `kubectl edit deployment app-misteriosa -n misterio-crashloop` ou modificar seu arquivo YAML e usar `kubectl apply -f ...` novamente."
        validation:
          - command: "kubectl get deployment app-misteriosa -n misterio-crashloop -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo '0'"
            expectedOutput: "1"
            errorMessage: "O Deployment 'app-misteriosa' ainda não tem uma réplica pronta. A solução ainda não foi aplicada corretamente."
